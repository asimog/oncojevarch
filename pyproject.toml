[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oncojev"
version = "0.1.0"
description = "Experiment-first scaffold for Jev-augmented autonomous computational cancer discovery"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
]
agents = [
  "openai-agents[any-llm]==0.22.3",
  "openai-codex==0.158.0",
]
jev = [
  "typesafe-sdk==0.7.2",
]

[project.scripts]
oncojev = "oncodex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "oncodex*",
  "oncolab*",
  "research*",
  "evidence*",
  "discovery*",
  "execution*",
  "jev*",
  "oncox*",
  "evaluation*",
  "store*",
  "observatory*",
  "experiments*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["experiments/architecture/a001_oncodex_codex_smoke.py"]
